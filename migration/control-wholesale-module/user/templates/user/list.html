{% extends "layout.html" %}
{% block page_header %}
Listado de clientes
{% endblock %}
{% load widget_tweaks %}
{% block content %}
<style>
  .customer-statuses {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .customer-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 8px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
  }

  .status-active { background: rgba(0, 212, 123, .12); border-color: rgba(0, 212, 123, .3); color: #72eeb7; }
  .status-inactive { background: rgba(140, 147, 164, .12); border-color: rgba(140, 147, 164, .25); color: #bec3ce; }
  .status-vip { background: rgba(255, 176, 0, .12); border-color: rgba(255, 176, 0, .3); color: #ffd36f; }
  .status-never { background: rgba(239, 71, 111, .1); border-color: rgba(239, 71, 111, .25); color: #ff9bb2; }
  .status-wholesale { background: rgba(139, 92, 246, .13); border-color: rgba(139, 92, 246, .32); color: #c4a7ff; }

  #customer-table .customer-actions-cell {
    min-width: 455px;
    white-space: normal;
  }

  .customer-actions {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .customer-actions .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 32px;
    margin: 0;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }

  .customer-actions .btn i { margin: 0; }

  @media (max-width: 991.98px) {
    #customer-table .customer-actions-cell { min-width: 300px; }
    .customer-actions { max-width: 330px; }
  }
</style>
<div class="col-lg-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">{{ customer_segment_label }}</h4>
        <p class="card-description">{{ customer_segment_description }}</p>
        <p class="card-description"><code>Seleccione el cliente para registrar una venta</code></p>
        <div class="table-responsive">
          <table class="table table-dark" id="customer-table">
            <thead>
              <tr>
                <th> Id </th>
                <th> Nombres </th>
                <th> Teléfono </th>
                <th> Estado </th>
                <th> Acciones </th>
              </tr>
            </thead>
            <tbody>

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
<script>
  $(document).ready(function() {

    $('#customer-table').dataTable({
        order: [[ 0, "desc" ]],
        responsive: true,
        autoWidth: false,
        columnDefs: [
            {
                name: 'id',
                orderable: true,
                searchable: false,
                targets: [0]
            },
            {
                name: 'name',
                orderable: true,
                searchable: true,
                targets: [1]
            },
            {
                name: 'phone',
                orderable: true,
                searchable: true,
                targets: [2]
            },
            {
                name: 'status',
                orderable: false,
                searchable: false,
                targets: [3]
            },
            {
                name: 'actions',
                orderable: false,
                searchable: false,
                className: 'customer-actions-cell',
                targets: [4]
            }

        ],
        searching: true,
        processing: true,
        serverSide: true,
        stateSave: false,
        ajax: {
            url: "{% url 'list-customer-ajax' %}",
            data: function(data) {
                data.segment = "{{ customer_segment }}";
            }
        }
    });

});


</script>
{% endblock %}
